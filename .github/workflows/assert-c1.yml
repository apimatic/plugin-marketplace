name: assert-c1

# Executable assertions for the C1 claims the dotnet-* skills make.
#
# The skills state facts about the emitted Core/ — retry defaults, redaction
# direction, parameter order, namespace layout. Those facts rot when the
# generator moves, and the rot is silent: nothing fails, the text simply stops
# being true. Ten false runtime claims shipped in five plugins for months before
# anyone checked.
#
# See tools/assert-c1/README.md.

on:
  pull_request:
    # All three SDK plugins now, including maxio-sdk. It documents the pre-4.0.0
    # surface and fails 100 of the general assertions by construction — but those
    # are pinned in maxio-pre-4.0.0-drift.txt and its own positive claims are
    # asserted by the pre400.* set, so a maxio diff is now genuinely checked rather
    # than merely triggering a green run that asserted nothing about it.
    paths:
      - 'plugins/paypal-sdk/skills/dotnet-*/**'
      - 'plugins/twilio-sdk/skills/dotnet-*/**'
      - 'plugins/maxio-sdk/skills/dotnet-*/**'
      - 'tools/assert-c1/**'
      - '.github/workflows/assert-c1.yml'
  push:
    branches: [main, dev]
    paths:
      - 'plugins/paypal-sdk/skills/dotnet-*/**'
      - 'plugins/twilio-sdk/skills/dotnet-*/**'
      - 'plugins/maxio-sdk/skills/dotnet-*/**'
      - 'tools/assert-c1/**'
  schedule:
    # Weekly. The generator-drift job below is the reason this runs on a timer:
    # it catches the generator moving, which no PR to this repo would trigger.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event too: on main, github.ref is the same for a push and for the
  # weekly schedule, so a push would cancel the scheduled run — and the schedule is
  # the ONLY trigger for the generator-drift job.
  group: assert-c1-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fixture list lives in tools/assert-c1/fixtures.json so there is one place
  # to update when a plugin is regenerated. This job turns it into the matrix
  # rather than duplicating it in YAML, where the two would drift apart quietly.
  fixtures:
    name: read fixtures.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          d = json.load(open("tools/assert-c1/fixtures.json"))
          fx = d["fixtures"]
          # An empty fixture list would make the `static` matrix empty, and a matrix job with
          # no entries is SKIPPED, not failed — so the suite would report green having asserted
          # nothing at all. That is the exact failure this whole tool exists to catch, so it is
          # a hard error here rather than a quiet pass.
          if not fx:
              print("fixtures.json lists no fixtures — nothing would be asserted", file=sys.stderr)
              raise SystemExit(1)
          print("matrix=" + json.dumps({"include": fx}))
          PY

  static:
    name: static · ${{ matrix.name }}
    needs: fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.fixtures.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone the SDK fixture
        run: |
          git clone --depth 1 --branch "${{ matrix.ref }}" \
            "${{ matrix.repo }}.git" "$RUNNER_TEMP/sdk"

      # A fixture on a different core surface carries a baseline of assertions that
      # cannot hold there, so the run is graded against that baseline: red when the
      # delta CHANGES, not while it merely exists. Fixtures without one must be clean.
      - name: Assert
        env:
          EXPECT: ${{ matrix.expectFailures }}
        run: |
          if [ -n "$EXPECT" ]; then
            python tools/assert-c1/assert_c1.py "$RUNNER_TEMP/sdk" \
              --surface "${{ matrix.surface }}" \
              --json "$RUNNER_TEMP/report-${{ matrix.name }}.json" \
              --expect-failures "tools/assert-c1/$EXPECT"
          else
            python tools/assert-c1/assert_c1.py "$RUNNER_TEMP/sdk" \
              --surface "${{ matrix.surface }}" \
              --json "$RUNNER_TEMP/report-${{ matrix.name }}.json"
          fi

      # Proves the suite can still fail. A regex loosened during a refactor until
      # it matches anything leaves every assertion green over a rotted claim —
      # this is the only thing that catches that. It also fails when a mutation
      # cannot be applied, since nothing caught is not the same as all caught.
      # The mutation set is chosen by --surface, and on a baselined fixture "caught"
      # means the failing set MOVED against that baseline, not that it became non-empty.
      - name: Mutation test
        if: matrix.mutationTest
        env:
          EXPECT: ${{ matrix.expectFailures }}
        run: |
          if [ -n "$EXPECT" ]; then
            python tools/assert-c1/mutation_test.py "$RUNNER_TEMP/sdk"               --surface "${{ matrix.surface }}"               --expect-failures "tools/assert-c1/$EXPECT"
          else
            python tools/assert-c1/mutation_test.py "$RUNNER_TEMP/sdk"               --surface "${{ matrix.surface }}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assert-c1-report-${{ matrix.name }}
          path: ${{ runner.temp }}/report-${{ matrix.name }}.json
          if-no-files-found: ignore

  behaviour:
    name: behavioural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Runs the SDK rather than reading it: how many times a stub handler is
      # called, what ToString() returns, whether a transient client refetches a
      # token, whether the DI extension really wires the logger. PayPal-specific
      # by construction — see the csproj — so it does not fan out over fixtures.
      - name: Run the behavioural checks
        working-directory: tools/assert-c1/behaviour
        run: dotnet run -c Release

  generator-drift:
    name: generator template drift
    runs-on: ubuntu-latest
    # Only useful on a timer or by hand: nothing in a PR to this repo moves the
    # generator, and the job is about the generator moving.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone the generator
        id: clone
        env:
          TOKEN: ${{ secrets.CODEGEN_V2_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CODEGEN_V2_TOKEN — skipping. Set the secret to enable this job."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$TOKEN@github.com/apimatic/codegen-v2.git" \
            "$RUNNER_TEMP/gen"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # This fixture is EXPECTED to fail — the template still stamps 4.0.0 while
      # its Core has moved ahead of both shipped SDKs. --expect-failures pins the
      # known set, so the job goes red when the drift CHANGES, not while it
      # merely exists. A permanently red job is one everybody learns to ignore.
      # It also flags a baselined failure that becomes UNSETTLEABLE, which is a
      # generator change wearing the disguise of a fix.
      - name: Assert against StaticCode
        if: steps.clone.outputs.skipped == 'false'
        run: |
          python tools/assert-c1/assert_c1.py \
            "$RUNNER_TEMP/gen/src/CodegenV2/StaticCode" \
            --surface 4.0.0 \
            --expect-failures tools/assert-c1/generator-template-drift.txt
